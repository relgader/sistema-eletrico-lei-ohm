
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de Circuitos Elétricos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Simulador Elétrico - by Richard</h1>

        <p>Explore a Lei de Ohm de forma interativa.</p>

    </header>

    <main>
        <div class="painel-principal">

            <section class="controles">

                <h2>Configurações do circuito</h2>

                <div>

                    <label for="tensao">Tensão elétrica (V)</label>

                    <input
                        type="range"
                        id="tensao"
                        min="0"
                        max="24"
                        value="12"
                    >

                    <span id="valorTensao">12 V</span>

                </div>

                <div>

                    <label for="resistencia">Resistência (Ω)</label>

                    <input
                        type="range"
                        id="resistencia"
                        min="1"
                        max="100"
                        value="10"
                    >

                    <span id="valorResistencia">10 Ω</span>

                </div>

            </section>

            <section class="resultados">

                <h2>Resultados:</h2>

                <div>
                    <p>Corrente elétrica: 
                        <span id="valorCorrente">1,2 A</span>
                    </p>
                </div>

                <div>
                    <p>Potência elétrica: 
                        <span id="valorPotencia">14,4 W</span>
                    </p>
                </div>

                <h2>Circuito elétrico:</h2>

                <svg width="100%" viewBox="0 0 600 250">

                    //superior
                    <line x1="100" y1="50" x2="210" y2="50"
                        stroke="#38bdf8" stroke-width="4"/>

                    //resistor
                    <rect x="210" y="35" width="80" height="30"
                        fill="#1d2b40" stroke="#f1f5f9" stroke-width="3" />

                    //lateral direita
                    <line x1="400" y1="50" x2="400" y2="200" 
                        stroke="#38bdf8" stroke-width="4" />

                    //inferior
                    <line x1="400" y1="200" x2="100" y2="200"
                        stroke="#38bdf8" stroke-width="4" />

                    //lateral esquerda superior
                    <line x1="100" y1="50" x2="100" y2="95" 
                        stroke="#38bdf8" stroke-width="4" />
                        
                    //lateral esquerda inferior
                    <line x1="100" y1="155" x2="100" y2="200"
                        stroke="#38bdf8" stroke-width="4" />

                    //bateria  
                      
                   //positivo <line x1="75" y1="95" x2="125" y2="95"
                    stroke="#f1f5f9" stroke-width="4" />
                   //negativo <line x1="85" y1="155" x2="115" y2="155"
                    stroke="#f1f5f9" stroke-width="4" />

                </svg>


            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
