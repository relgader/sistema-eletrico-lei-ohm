
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de Circuitos Elétricos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Simulador Elétrico - by Richard</h1>

        <p>Explore a Lei de Ohm de forma interativa.</p>

    </header>

    <main>
        <div class="painel-principal">

            <section class="controles">

                <h2>Configurações do circuito</h2>

                <div>

                    <label for="tensao">Tensão elétrica (V)</label>

                    <input
                        type="range"
                        id="tensao"
                        min="0"
                        max="24"
                        value="12"
                    >

                    <span id="valorTensao">12 V</span>

                </div>

                <div>

                    <label for="resistencia">Resistência (Ω)</label>

                    <input
                        type="range"
                        id="resistencia"
                        min="1"
                        max="100"
                        value="10"
                    >

                    <span id="valorResistencia">10 Ω</span>

                </div>

                <div class="controle-polaridade">

                    <label>Polaridade da bateria</label>

                    <button id="inverterPolaridade">
                     Inverter polaridade
                    </button>

                    <p>
                    Sentido da corrente:
                    <span id="sentidoCorrente">Horário</span>
                    </p>

                </div>

            </section>

            <section class="resultados">

                <h2>Resultados:</h2>

                <div>
                    <p>Corrente elétrica: 
                        <span id="valorCorrente">1,2 A</span>
                    </p>
                </div>

                <div>
                    <p>Potência elétrica: 
                        <span id="valorPotencia">14,4 W</span>
                    </p>
                </div>

                <h2>Circuito elétrico:</h2>

                <svg width="100%" viewBox="0 0 600 250">

                    <!-- Fio superior esquerdo -->
                    <line x1="100" y1="50" x2="225" y2="50"
                        stroke="#38bdf8" stroke-width="4"/>

                    <!-- Fio superior direito -->
                    <line x1="275" y1="50" x2="400" y2="50"
                        stroke="#38bdf8" stroke-width="4"/>
                    
                                        <!-- Conexão esquerda da lâmpada -->
                    <line x1="225" y1="50" x2="240" y2="50"
                        stroke="#38bdf8" stroke-width="4"/>

                    <!-- Conexão direita da lâmpada -->
                    <line x1="260" y1="50" x2="275" y2="50"
                        stroke="#38bdf8" stroke-width="4"/>

                    <!-- Fio direito -->
                    <line x1="400" y1="50" x2="400" y2="200"
                        stroke="#38bdf8" stroke-width="4"/>

                    <!-- Fio inferior -->
                    <line x1="400" y1="200" x2="100" y2="200"
                        stroke="#38bdf8" stroke-width="4"/>

                    <!-- Fio esquerdo superior -->
                    <line x1="100" y1="50" x2="100" y2="95"
                        stroke="#38bdf8" stroke-width="4"/>

                    <!-- Fio esquerdo inferior -->
                    <line x1="100" y1="153" x2="100" y2="200"
                        stroke="#38bdf8" stroke-width="4"/>

                    <!-- Setas indicando o sentido da corrente -->

                    <!-- Fio superior: esquerda para direita -->
                    <path id="setaSuperior"
                        d="M170 42 L185 50 L170 58"
                        fill="none"
                        stroke="#22c55e"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <!-- Fio direito: cima para baixo -->
                    <path id="setaDireita"
                        d="M392 115 L400 130 L408 115"
                        fill="none"
                        stroke="#22c55e"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <!-- Fio inferior: direita para esquerda -->
                    <path id="setaInferior"
                        d="M230 192 L215 200 L230 208"
                        fill="none"
                        stroke="#22c55e"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <!-- Bateria -->
                    <line x1="75" y1="95" x2="125" y2="95"
                        stroke="#f1f5f9" stroke-width="4"/>

                    <line x1="85" y1="155" x2="115" y2="155"
                        stroke="#f1f5f9" stroke-width="4"/>
                    
                    <!-- Polo superior da bateria -->
                    <text id="poloSuperior"
                        x="135" y="100"
                        fill="#22c55e"
                        font-size="14"
                        font-weight="bold">
                        +12 V
                    </text>

                    <!-- Polo inferior da bateria -->
                    <text id="poloInferior"
                        x="135" y="160"
                        fill="#38bdf8"
                        font-size="14"
                        font-weight="bold">
                        0 V
                    </text>

                   <!-- Brilho externo -->
                    <circle id="lampGlow"
                        cx="250" cy="30" r="30"
                        fill="#facc15" opacity="0.25"/>

                    <!-- Corpo da lâmpada -->
                    <circle id="lampBulbo"
                        cx="250" cy="30" r="22"
                        fill="#334155"
                        stroke="#f1f5f9"
                        stroke-width="3"/>

                    <!-- Filamento -->
                    <path id="lampFilamento"
                        d="M240 30 L245 23 L250 37 L255 23 L260 30"
                        fill="none"
                        stroke="#facc15"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <!-- Base -->
                    <path d="M240 50 L240 58 L260 58 L260 50"
                        fill="#94a3b8"
                        stroke="#f1f5f9"
                        stroke-width="2"/>

                    <line x1="240" y1="54" x2="260" y2="54"
                        stroke="#334155" stroke-width="2"/>

                    <line x1="243" y1="62" x2="257" y2="62"
                        stroke="#f1f5f9" stroke-width="3"/>


                    <!-- Caminho invisível percorrido pela corrente -->
                    <path
                        id="caminhoCorrente"
                        d="M100 95 L100 50 L225 50 L240 50 L260 50 L275 50 L400 50 L400 200 L100 200 L100 155 L100 95"
                        fill="none"
                        stroke="none"
                    />

                    <!-- Partículas da corrente elétrica -->
                    <circle id="particula1" r="4" fill="#facc15"/>
                    <circle id="particula2" r="4" fill="#facc15"/>
                    <circle id="particula3" r="4" fill="#facc15"/>
                    <circle id="particula4" r="4" fill="#facc15"/>
                    <circle id="particula5" r="4" fill="#facc15"/>
                
                </svg>


            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
