<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> Simulador de Circuitos Elétrico</title>
    </head>

    <body> 

            <header>

                <h1>Simulador Elétrico - by Richard</h1>

                <p>Explore a Lei de Ohm de forma interativa.</p>            
            </header>
       
        <main>

            <section>

                <h2>Configurações do circuito</h2>

                <div>

                    <label for="tensao">Tensão elétrica (V)</label>

                    <input
                    type="range"
                    id="tensao"
                    min="0"
                    max="24"
                    value="12"
                    >

                    <span>12 V</span>
                </div>

                <div>

                    <label for="resistencia">Resistência (Ω)</label>

                    <input
                    type="range"
                    id="resistencia"
                    min="0"
                    max="100"
                    value="10"
                    >

                    <span>10 Ω</span>
                </div>

            </section>
            
            <section>
                <h2>Resultados</h2>

                <div>
                    <p>Corrente elétrica: 1,2 A</p>
                </div>

                <div>
                    <p>Potência elétrica: 14,4 W</p>
                </div>

            </section>
            
        </main>


    </body>
